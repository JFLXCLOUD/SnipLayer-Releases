name: Feature request
description: Suggest a focused SnipLayer improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow problem
      description: What are you trying to accomplish, and where does the current workflow slow you down?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
    validations:
      required: true
